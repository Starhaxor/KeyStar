name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify README release-gate instructions
        shell: pwsh
        run: |
          $readme = Get-Content -Raw README.md
          $requiredCommands = @(
            'docker compose up -d db',
            'test-integration.ps1',
            'npm run e2e',
            'cmake -S backend/sdk/cpp'
          )
          $requiredEnvironment = @(
            'DATABASE_URL',
            'LICENSE_HMAC_KEY',
            'HARDWARE_HMAC_KEY',
            'ED25519_PRIVATE_KEY',
            'LICENSE_ISSUER',
            'LICENSE_AUDIENCE',
            'PRODUCT',
            'ADMIN_SESSION_SECRET',
            'TEST_DATABASE_URL'
          )
          $missing = @($requiredCommands + $requiredEnvironment | Where-Object { -not $readme.Contains($_) })
          if ($missing.Count -gt 0) {
            throw "README missing required verification documentation: $($missing -join ', ')"
          }

  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_DB: keystar_test
          POSTGRES_USER: keystar_test
          POSTGRES_PASSWORD: keystar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keystar_test -d keystar_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgres://keystar_test:keystar_test@localhost:5432/keystar_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - run: go test ./...

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  admin-e2e:
    needs: [backend, admin]
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_DB: keystar_test
          POSTGRES_USER: keystar_test
          POSTGRES_PASSWORD: keystar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keystar_test -d keystar_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://keystar_test:keystar_test@127.0.0.1:5432/keystar_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
        working-directory: admin
      - run: npx playwright install --with-deps chromium
        working-directory: admin
      - run: npm run e2e
        working-directory: admin

  sdk-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SDK tests with MSVC
        run: cmake -S backend/sdk/cpp -B build/sdk -DKEYSTAR_BUILD_TESTS=ON -G "Visual Studio 17 2022" -A x64
      - name: Build SDK tests
        run: cmake --build build/sdk --config Release
      - name: Run SDK tests
        run: ctest --test-dir build/sdk -C Release --output-on-failure
