name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify README release-gate instructions
        shell: pwsh
        run: |
          $readme = Get-Content -Raw README.md
          $requiredCommands = @(
            'docker compose up -d db',
            'test-integration.ps1',
            'npm run e2e',
            'cmake -S backend/sdk/cpp'
          )
          $requiredEnvironment = @(
            'DATABASE_URL',
            'LICENSE_HMAC_KEY',
            'HARDWARE_HMAC_KEY',
            'ED25519_PRIVATE_KEY',
            'LICENSE_ISSUER',
            'LICENSE_AUDIENCE',
            'PRODUCT',
            'ADMIN_SESSION_SECRET',
            'ADMIN_BOOTSTRAP_TOKEN',
            'ADMIN_MFA_ENCRYPTION_KEY',
            'APPLICATION_KEY_ENCRYPTION_KEYS',
            'APPLICATION_KEY_ACTIVE_VERSION',
            'TEST_DATABASE_URL'
          )
          $missing = @($requiredCommands + $requiredEnvironment | Where-Object { -not $readme.Contains($_) })
          if ($missing.Count -gt 0) {
            throw "README missing required verification documentation: $($missing -join ', ')"
          }

  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:15@sha256:926f8799aef36e00001cfe15fba7abbd37d3c5224ea57e4c858e4bb670f10561
        env:
          POSTGRES_DB: keystar_test
          POSTGRES_USER: keystar_test
          POSTGRES_PASSWORD: keystar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keystar_test -d keystar_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgres://keystar_test:keystar_test@localhost:5432/keystar_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.6"
      - run: go test -p 1 ./...
      - run: go vet ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: govulncheck ./...
      - run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
      - run: gosec -quiet -severity high -confidence high ./...

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run lint
      - run: npm run build

  admin-e2e:
    needs: [backend, admin]
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:15@sha256:926f8799aef36e00001cfe15fba7abbd37d3c5224ea57e4c858e4bb670f10561
        env:
          POSTGRES_DB: keystar_test
          POSTGRES_USER: keystar_test
          POSTGRES_PASSWORD: keystar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keystar_test -d keystar_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://keystar_test:keystar_test@127.0.0.1:5432/keystar_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.6"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
        working-directory: admin
      - run: npx playwright install --with-deps chromium
        working-directory: admin
      - run: npm run e2e
        working-directory: admin

  sdk-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure SDK tests with MSVC
        run: cmake -S backend/sdk/cpp -B build/sdk -DKEYSTAR_BUILD_TESTS=ON -G "Visual Studio 17 2022" -A x64
      - name: Build SDK tests
        run: cmake --build build/sdk --config Release
      - name: Run SDK tests
        run: ctest --test-dir build/sdk -C Release --output-on-failure

  sdk-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install curl development headers
        run: sudo apt-get update && sudo apt-get install --yes libcurl4-openssl-dev
      - name: Configure SDK tests
        run: cmake -S backend/sdk/cpp -B build/sdk-linux -DKEYSTAR_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build SDK tests
        run: cmake --build build/sdk-linux --parallel
      - name: Run SDK tests
        run: ctest --test-dir build/sdk-linux --output-on-failure
