services:
  db:
    image: postgres:15@sha256:926f8799aef36e00001cfe15fba7abbd37d3c5224ea57e4c858e4bb670f10561
    environment:
      POSTGRES_DB: keystar_test
      POSTGRES_USER: keystar_test
      POSTGRES_PASSWORD: keystar_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keystar_test -d keystar_test"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - keystar-test-data:/var/lib/postgresql/data

volumes:
  keystar-test-data:
