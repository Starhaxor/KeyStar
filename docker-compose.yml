services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: keystar_test
      POSTGRES_USER: keystar_test
      POSTGRES_PASSWORD: keystar_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keystar_test -d keystar_test"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - keystar-test-data:/var/lib/postgresql/data

volumes:
  keystar-test-data:
